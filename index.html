<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ネスペ知識カード</title>
  <meta name="description" content="ネットワークスペシャリスト試験 科目B対策の知識カード">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='3' fill='%231b1b1b'/%3E%3Ccircle cx='9' cy='16' r='3.2' fill='%23ffffff'/%3E%3Ccircle cx='23' cy='9' r='3.2' fill='%23ffffff'/%3E%3Ccircle cx='23' cy='23' r='3.2' fill='%23ffffff'/%3E%3Cpath d='M9 16L23 9M9 16L23 23M23 9V23' stroke='white' stroke-width='1.8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1>ネスペ知識カード</h1>
      <p class="sub">科目B対策 ・ 過去問の解答に必要な知識</p>
      <div class="stats" id="stats" aria-live="polite"></div>
    </div>
  </header>

  <nav class="controls wrap" aria-label="表示の切り替え">
    <div class="seg" role="group" aria-label="モード">
      <button type="button" data-mode="test">テスト</button>
      <button type="button" data-mode="read">読む</button>
    </div>
    <details class="filters" id="filters" open>
      <summary>
        <span class="f-title">絞り込み</span>
        <span class="f-desc" id="filterDesc"></span>
        <span class="f-count" id="selCount" aria-live="polite"></span>
      </summary>
      <fieldset class="fgroup"><legend>年度</legend><div class="opts" id="examGroup"></div></fieldset>
      <fieldset class="fgroup"><legend>分野</legend><div class="opts" id="deckGroup"></div></fieldset>
      <fieldset class="fgroup"><legend>段階</legend><div class="opts" id="levelGroup"></div></fieldset>
    </details>
    <div class="row">
      <div class="row-end">
        <select id="statusFilter" aria-label="判定で絞り込み">
          <option value="all">判定：すべて</option>
          <option value="none">判定：未判定</option>
          <option value="unknown">判定：知らなかった</option>
          <option value="known">判定：知ってた</option>
        </select>
        <label class="toggle"><input type="checkbox" id="shuffle"> シャッフル</label>
      </div>
    </div>
  </nav>

  <main class="wrap" id="view"></main>

  <footer class="wrap foot">
    <div class="foot-actions">
      <button type="button" id="copyUnknown">「知らなかった」を一覧でコピー</button>
      <button type="button" id="resetMarks" class="ghost">記録をリセット</button>
    </div>
    <p class="note">判定の記録はこのブラウザにだけ保存されます（スマホとPCは別々）。</p>
    <p class="note">過去問の出典：独立行政法人情報処理推進機構 ネットワークスペシャリスト試験 問題・解答例。カードの解説は独自に作成したものです。</p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
